name: CI

# Build gate on every push and PR to main. Compiles the Release binary with
# MinGW (warnings are errors) and verifies it is fully static + manifest-embedded
# The same checks the release workflow runs before publishing.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/dependabot.yml'
  workflow_dispatch:

  # On a timer as well as on every push. Nothing here changes between those
  # runs; what changes underneath it does. A new toolchain, a new runner
  # image, a yanked dependency. Any of those turns a green build red with no
  # commit, and without this nobody finds out until the next push.
  schedule:
    - cron: '5 */6 * * *'
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A second push to the default branch used to cancel the run for the first one, so that commit was never
  # checked by anything. Only a superseded pull request push is safe to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Force any JavaScript action that still declares Node 20 onto Node 24. Every
# action used below already targets Node 24, so this is only a backstop.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (Windows, MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MinGW-w64 (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Compile resources
        run: |
          mkdir -p build
          windres resource.rc -O coff -o build/resource.o

      # Keep this g++ invocation in sync with scripts/build.ps1 and
      # .github/workflows/release.yml. All three must match the real build.
      - name: Build (Release, static, warnings as errors)
        run: |
          g++ -std=c++17 -O3 -DNDEBUG -Wall -Wextra -Werror -mwindows -I include \
            -o build/FLOW.exe \
            src/*.cpp src/ui/*.cpp build/resource.o \
            -luser32 -lgdi32 -lcomctl32 -lgdiplus -lshell32 \
            -static -static-libgcc -static-libstdc++

      # The engine tests link FlowEngine.cpp only -- no window, no hooks, no
      # elevation -- so they run unmodified on a GitHub runner.
      - name: Test (doctest)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I include -I tests \
            -o build/FLOW_Tests.exe \
            tests/*.cpp src/FlowEngine.cpp \
            -luser32 -static -static-libgcc -static-libstdc++
          ./build/FLOW_Tests.exe

      - name: Verify the binary is self-contained + manifest embedded
        run: |
          echo "== DLL imports =="
          objdump -p build/FLOW.exe | grep -i "DLL Name"
          # Fail if any MinGW runtime DLL leaked into the imports.
          if objdump -p build/FLOW.exe | grep -iE "libwinpthread|libstdc\+\+|libgcc|libgomp"; then
            echo "::error::Non-system DLL dependency found - build is NOT static."
            exit 1
          fi
          # Fail if the admin-elevation manifest did not get embedded.
          if ! grep -aq "requireAdministrator" build/FLOW.exe; then
            echo "::error::Manifest not embedded (no requireAdministrator)."
            exit 1
          fi
          echo "OK: self-contained + manifest embedded."

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: FLOW-ci-build
          path: build/FLOW.exe
          if-no-files-found: error
          retention-days: 7
